name: Rename file to index

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename HTML file to index.html
        run: |
          git mv waheed-market-orders.html index.html
          git config user.name "waheed-market"
          git config user.email "wrw99991@gmail.com"
          git commit -m "Rename waheed-market-orders.html to index.html"
          git push
